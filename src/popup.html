<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Simple Chat for Kick</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Simple Chat for Kick</h1>
      <p class="sub">Simple chat, deleted messages, purple theme.</p>
    </header>

    <ul class="opts">
      <li>
        <label for="simpleChat">
          <span class="t">Simple chat</span>
          <span class="d">Just &ldquo;username: text&rdquo; &mdash; no badges, emotes or images. No sub, gift, Kicks, pinned or drops clutter, no animations.</span>
        </label>
        <input type="checkbox" id="simpleChat" />
      </li>
      <li>
        <label for="showDeleted">
          <span class="t">Show deleted messages</span>
          <span class="d">Deleted messages stay in chat, highlighted, plus a log of who wrote and removed them</span>
        </label>
        <input type="checkbox" id="showDeleted" />
      </li>
      <li>
        <label for="rememberSettings">
          <span class="t">Remember settings</span>
          <span class="d">1080p quality, collapsed sidebar and chat, and browse filters come back every time</span>
        </label>
        <input type="checkbox" id="rememberSettings" />
      </li>
      <li>
        <label for="purpleTheme">
          <span class="t">Purple theme</span>
          <span class="d">Repaint Kick green as #9147ff</span>
        </label>
        <input type="checkbox" id="purpleTheme" />
      </li>
    </ul>

    <footer>
      <button id="reset" type="button">Reset defaults</button>
      <span id="status" class="status"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
